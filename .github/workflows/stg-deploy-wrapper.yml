# stg-deploy wrapper CI gate (SIN-66620 / SIN-66600 impl 2/4, ADR 0111).
#
# Runs shellcheck + the hermetic wrapper test for deploy/scripts/stg-deploy.sh
# on every PR that touches the wrapper or its test, and on push to main. The
# wrapper's real docker/cosign/compose side-effects never run in CI — the
# hermetic test (stg-deploy.test.sh) shims docker + cosign and redirects every
# host path into a sandbox, proving the carry-set fail-closed contract (C1–C5)
# without a docker daemon and BEFORE any real `compose up` could fire.

name: stg-deploy-wrapper

on:
  pull_request:
    paths:
      - "deploy/scripts/stg-deploy.sh"
      - "deploy/scripts/stg-deploy.test.sh"
      - ".github/workflows/stg-deploy-wrapper.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SHA-pinned per repo convention (SIN-62303): a tag re-publish on a
      # third-party action would otherwise smuggle workflow code into CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: shellcheck stg-deploy wrapper + test
        run: |
          shellcheck --severity=warning -x \
            deploy/scripts/stg-deploy.sh \
            deploy/scripts/stg-deploy.test.sh

      - name: hermetic carry-set extraction test
        run: bash deploy/scripts/stg-deploy.test.sh
