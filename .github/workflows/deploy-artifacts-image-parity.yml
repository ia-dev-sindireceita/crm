# deploy-artifacts-image-parity — SIN-66621 / ADR 0111 (SIN-66600) C6 gate.
#
# Ticket 1/4 (SIN-66619) taught the Dockerfile to COPY the staging deploy
# topology (compose / caddy / unbound / scripts-minio) into the cosign-signed
# image under a stable /deploy prefix. Ticket 2/4 (SIN-66620) teaches the
# deploy wrapper to `docker cp` /deploy out of the just-verified image and
# install it on the host. That "repo == image == host" chain is only sound if
# the image bytes are IDENTICAL to the repo sources — a Dockerfile COPY path
# could otherwise drift and ship stale infra to staging without any signal.
#
# This gate builds the crm-server target, extracts the image's /deploy tree
# via `docker cp`, and asserts every carried artifact is byte-identical to its
# repo source (and that the image carries no /deploy file the parity manifest
# does not know about). It is the checked half of ADR 0111.
#
# Modeled on delta-compiles-against-upstream-main (SIN-66432): fail-closed,
# runs on every PR to main so it lands in the PR statusCheckRollup and gates
# merge. REQUIRED-STATUS CANDIDATE: promote to a required status check once
# upstream branch protection lands (tracked with the rest of SIN-66600).
#
# Pin policy: third-party actions are SHA-pinned per SIN-62303 / SIN-62307.
# Bump the SHA and the trailing version comment together when upgrading.

name: deploy-artifacts-image-parity

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/compose/**
      - deploy/caddy/**
      - infra/caddy/**
      - scripts/minio/**
      - scripts/check-deploy-artifacts-parity.sh
      - scripts/check-deploy-artifacts-parity.test.sh
      - .github/workflows/deploy-artifacts-image-parity.yml
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-artifacts-image-parity:
    name: deploy-artifacts-image-parity
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Gate logic is docker-independent, so prove it stays correct on every
      # run before we trust it against a freshly built image.
      - name: gate self-test (hermetic)
        run: bash scripts/check-deploy-artifacts-parity.test.sh

      - name: set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build the crm-server final stage and load it into the local daemon so
      # `docker cp` can read the carried /deploy layers. Cache scoped to this
      # workflow to keep cold builds manageable (mirrors docker-smoke).
      - name: docker build --target crm-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: crm-server
          tags: local/crm-server:deploy-parity
          push: false
          load: true
          cache-from: type=gha,scope=deploy-artifacts-image-parity
          cache-to: type=gha,scope=deploy-artifacts-image-parity,mode=max
          provenance: false

      # Extract the image's /deploy tree without booting the crm-server
      # entrypoint (which needs DATABASE_URL et al.). `docker create` makes the
      # filesystem layers available to `docker cp`; the `/.` copies CONTENTS.
      - name: extract image /deploy tree
        run: |
          set -euo pipefail
          CID=$(docker create local/crm-server:deploy-parity)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          rm -rf ./extracted-deploy
          mkdir -p ./extracted-deploy
          docker cp "$CID:/deploy/." ./extracted-deploy/
          echo "extracted /deploy contents:"
          find ./extracted-deploy -type f | sort

      - name: assert image /deploy == repo bytes
        run: bash scripts/check-deploy-artifacts-parity.sh ./extracted-deploy "$GITHUB_WORKSPACE"
