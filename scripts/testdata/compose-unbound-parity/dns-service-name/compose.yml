# Fixture: catch-all Caddyfile + unbound sidecar present, but caddy pins
# its resolver to the SERVICE NAME (`dns: ["unbound"]`) instead of an IP
# literal. This is the exact SIN-66592 deploy crash — docker cannot write
# a service name into /etc/resolv.conf. The lint must catch it: exit 1.
name: dns-service-name-fixture

networks:
  crm:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

services:
  app:
    image: alpine:3.20

  unbound:
    image: mvance/unbound:1.22.0
    networks:
      crm:
        ipv4_address: 172.29.0.53
    volumes:
      - ./caddy/unbound.conf:/opt/unbound/etc/unbound/a-records.conf:ro

  caddy:
    image: caddy:2-alpine
    networks: [crm]
    dns: ["unbound"]
    volumes:
      - ./caddy:/etc/caddy:ro
    depends_on:
      app: { condition: service_started }
      unbound: { condition: service_started }
